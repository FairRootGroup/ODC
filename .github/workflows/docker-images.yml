name: Docker Images

on:
  push:
    branches:
      - master
    paths:
      - 'utils/ci/Dockerfile.*'
  pull_request:
    paths:
      - 'utils/ci/Dockerfile.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/fairrootgroup/odc-ci

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora39
            build-args: FEDORA_VERSION=39
          - image: fedora40
            build-args: FEDORA_VERSION=40
          - image: fedora41
            build-args: FEDORA_VERSION=41
          - image: fedora42
            build-args: FEDORA_VERSION=42
          - image: fedora42-boost190
            build-args: |
              FEDORA_VERSION=42
              BOOST_VERSION=90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: utils/ci
          file: utils/ci/Dockerfile.fedora
          build-args: ${{ matrix.build-args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_PREFIX }}:${{ matrix.image }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}:${{ matrix.image }}-cache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}:${{ matrix.image }}-cache,mode=max
